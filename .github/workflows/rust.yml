name: build googleads-rs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned protoc (25.3)
      run: |
        curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip -o /tmp/protoc.zip
        sudo unzip -q /tmp/protoc.zip -d /usr/local
        protoc --version
    - name: Install Rust (stable)
      uses: dtolnay/rust-toolchain@stable
    - name: Check (xtask)
      run: cargo xtask check

  test-with-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned protoc (25.3)
      run: |
        curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip -o /tmp/protoc.zip
        sudo unzip -q /tmp/protoc.zip -d /usr/local
        protoc --version
    - name: Install Rust (stable)
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin
    - name: Run tests, generate coverage and JUnit XML reports
      run: cargo tarpaulin --all-features --workspace --out Xml --out xml --output-dir target/tarpaulin/
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: target/tarpaulin/cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/tarpaulin/junit.xml
        flags: rust-tarpaulin

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned protoc (25.3)
      run: |
        curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip -o /tmp/protoc.zip
        sudo unzip -q /tmp/protoc.zip -d /usr/local
        protoc --version
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Format check (xtask)
      run: cargo xtask fmt
    - name: Clippy (xtask)
      run: cargo xtask clippy

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run shellcheck on utils/*.sh
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        severity: warning
        paths: "utils/*.sh"